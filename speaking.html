<!doctype html>
<html lang="vi">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Speaking QUESTION</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="data/Speech.js"></script>
	<style>
		.container { max-width: 800px; margin: 32px auto; padding: 16px; }
		.controls { display:flex; gap:12px; align-items:center; }
		select { padding:8px 10px; font-size:16px; }
		.speed-control { display:flex; align-items:center; gap:8px; }
		button { padding:8px 12px; font-size:16px; }
		.assignment-list { padding-left: 18px; }
		.assignment-item { margin: 18px 0; padding: 14px 14px 10px; border: 1px solid #ddd; border-radius: 10px; background: #fff; }
		.assignment-head { display:flex; align-items:flex-start; justify-content:space-between; gap: 12px; }
		.question-title { margin: 0 0 10px; font-size: 18px; line-height: 1.4; }
		.assignment-actions { display:flex; align-items:center; gap: 8px; flex: 0 0 auto; }
		.speak-btn, .toggle-btn { border: 0; color: #fff; border-radius: 999px; width: 40px; height: 40px; padding: 0; font-size: 18px; cursor: pointer; box-shadow: 0 4px 12px rgba(31,111,235,0.22); }
		.speak-btn { background: #1f6feb; }
		.toggle-btn { background: #0f9d58; }
		.speak-btn:hover { background: #1557b0; }
		.toggle-btn:hover { background: #0b7f45; }
		.answer-list { display: none; margin: 0; padding-left: 20px; }
		.assignment-item.open .answer-list { display: block; }
		.assignment-item.open .toggle-btn { background: #0b7f45; }
		.answer-list li { margin: 6px 0; line-height: 1.45; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Speaking QUESTION</h1>
		<div class="controls">
			<label for="assignment-selector">Chọn Assignment:</label>
			<select id="assignment-selector" aria-label="Chọn Assignment">
				<option value="1">Assignment 1</option>
				<option value="2">Assignment 2</option>
				<option value="3">Assignment 3</option>
				<option value="4">Assignment 4</option>
				<option value="5">Assignment 5</option>
				<option value="6">Assignment 6</option>
			</select>
			<div class="speed-control">
				<label for="speech-speed">Tốc độ:</label>
				<select id="speech-speed" aria-label="Chọn tốc độ đọc">
					<option value="0.75">0.75x</option>
					<option value="0.9" selected>0.9x</option>
					<option value="1">1.0x</option>
					<option value="1.1">1.1x</option>
					<option value="1.25">1.25x</option>
				</select>
			</div>
		</div>

		<div id="assignment-content" style="margin-top:20px"></div>
	</div>

	<script>
		const selector = document.getElementById('assignment-selector');
		const speedSelector = document.getElementById('speech-speed');
		const content = document.getElementById('assignment-content');
		let availableVoices = [];

		function refreshVoices() {
			if (!('speechSynthesis' in window)) return;
			availableVoices = window.speechSynthesis.getVoices() || [];
		}

		function pickFemaleEnglishVoice() {
			const voices = availableVoices.length ? availableVoices : (window.speechSynthesis?.getVoices?.() || []);
			const englishVoices = voices.filter((voice) => /en[-_]/i.test(voice.lang || ''));
			const femaleHints = /(female|woman|zira|samantha|karen|serena|victoria|tessa|eva|aria|amy|susan|allison|victoria)/i;
			return (
				englishVoices.find((voice) => femaleHints.test(voice.name || '')) ||
				voices.find((voice) => femaleHints.test(voice.name || '')) ||
				englishVoices[0] ||
				voices[0] ||
				null
			);
		}

		const assignment1Questions = window.SPEECH_ASSIGNMENTS?.assignment1Questions || [];
		const assignment2Questions = window.SPEECH_ASSIGNMENTS?.assignment2Questions || [];
		const assignment3Content = window.SPEECH_ASSIGNMENTS?.assignment3Content || { part1: [], part2: [], part3: [] };

		function speakText(text) {
			if (!('speechSynthesis' in window)) {
				alert('Trình duyệt của bạn không hỗ trợ đọc văn bản.');
				return;
			}
			window.speechSynthesis.cancel();
			const message = new SpeechSynthesisUtterance(text);
			message.lang = 'en-US';
			message.rate = Number(speedSelector?.value || 0.9);
			const selectedVoice = pickFemaleEnglishVoice();
			if (selectedVoice) {
				message.voice = selectedVoice;
				message.lang = selectedVoice.lang || message.lang;
			}
			window.speechSynthesis.speak(message);
		}

		function getEnglishQuestion(prompt) {
			return String(prompt || '').split('(')[0].trim();
		}

		function renderQuestionSet(title, questions) {
			const html = [`<h2>${title}</h2><ol class="assignment-list">`];
			questions.forEach((item, index) => {
				const englishQuestion = getEnglishQuestion(item.prompt);
				html.push(`
					<li class="assignment-item">
						<div class="assignment-head">
							<div>
								<p class="question-title"><b>${index + 1}. ${item.prompt}</b></p>
							</div>
							<div class="assignment-actions">
								<button type="button" class="toggle-btn" title="Hiện / Ẩn câu trả lời" aria-label="Hiện / Ẩn câu trả lời" aria-expanded="false">▼</button>
								<button type="button" class="speak-btn" title="Đọc câu hỏi" aria-label="Đọc câu hỏi" data-speak="${englishQuestion.replace(/"/g, '&quot;')}">🔊</button>
							</div>
						</div>
						<ul class="answer-list">
							${item.answers.join('')}
						</ul>
					</li>
				`);
			});
			html.push(`</ol>`);
			content.innerHTML = html.join('');
			content.querySelectorAll('.toggle-btn').forEach((button) => {
				button.addEventListener('click', () => {
					const item = button.closest('.assignment-item');
					if (!item) return;
					const isOpen = item.classList.toggle('open');
					button.textContent = isOpen ? '▲' : '▼';
					button.setAttribute('aria-expanded', String(isOpen));
				});
			});
			content.querySelectorAll('.speak-btn').forEach((button) => {
				button.addEventListener('click', () => speakText(button.dataset.speak || ''));
			});
		}

		function renderAssignment1() {
			renderQuestionSet('Assignment 1', assignment1Questions);
		}

		function renderAssignment2() {
			renderQuestionSet('Assignment 2', assignment2Questions);
		}

		function renderAssignment3() {
			const html = [`<h2>Assignment 3</h2>`];

			html.push('<section class="assignment-item open"><div class="assignment-head"><div><p class="question-title"><b>Part 1 - Picture descriptions</b></p></div><div class="assignment-actions"><button type="button" class="toggle-btn" title="Hiện / Ẩn câu trả lời" aria-label="Hiện / Ẩn câu trả lời" aria-expanded="true">▲</button></div></div><div class="answer-list" style="display:block; padding-left:0;">');
			assignment3Content.part1.forEach((picture) => {
				html.push(`<div class="assignment-item open" style="margin-top:12px;"><div class="assignment-head"><div><p class="question-title"><b>${picture.title}</b></p></div><div class="assignment-actions"><button type="button" class="speak-btn" title="Đọc câu hỏi" aria-label="Đọc câu hỏi" data-speak="${picture.title.replace(/"/g, '&quot;')}">🔊</button></div></div><ul class="answer-list" style="display:block;">`);
				if (picture.imagePath) {
					html.push(`<li style="text-align:center; list-style:none; margin-bottom:15px;"><img src="${picture.imagePath}" alt="${picture.title.replace(/"/g, '&quot;')}" style="max-width:100%; max-height:300px; border-radius:8px;"></li>`);
				}
				html.push(picture.answers.join(''));
				html.push(`</ul></div>`);
			});
			html.push('</div></section>');

			html.push('<section class="assignment-item open"><div class="assignment-head"><div><p class="question-title"><b>Part 2 - Sample Dialogue</b></p></div><div class="assignment-actions"><button type="button" class="toggle-btn" title="Hiện / Ẩn câu trả lời" aria-label="Hiện / Ẩn câu trả lời" aria-expanded="true">▲</button></div></div><div class="answer-list" style="display:block; padding-left:0;">');
			html.push(`<div class="assignment-item open" style="margin-top:12px;"><div class="assignment-head"><div><p class="question-title"><b>${assignment3Content.part2.title}</b></p></div></div><ul class="answer-list" style="display:block;">`);
			if (assignment3Content.part2.imagePath) {
				html.push(`<li style="text-align:center; list-style:none; margin-bottom:15px;"><img src="${assignment3Content.part2.imagePath}" alt="Dialogue" style="max-width:100%; max-height:300px; border-radius:8px;"></li>`);
			}
			html.push(assignment3Content.part2.answers.join(''));
			html.push('</ul></div></section>');

			html.push('<section class="assignment-item open"><div class="assignment-head"><div><p class="question-title"><b>Part 3 - Personal answers</b></p></div><div class="assignment-actions"><button type="button" class="toggle-btn" title="Hiện / Ẩn câu trả lời" aria-label="Hiện / Ẩn câu trả lời" aria-expanded="true">▲</button></div></div><div class="answer-list" style="display:block;">');
			assignment3Content.part3.forEach((item, index) => {
				const englishQuestion = getEnglishQuestion(item.prompt);
				html.push(`
					<div class="assignment-item open" style="margin-top:12px;">
						<div class="assignment-head">
							<div>
								<p class="question-title"><b>${index + 1}. ${item.prompt}</b></p>
							</div>
							<div class="assignment-actions">
								<button type="button" class="toggle-btn" title="Hiện / Ẩn câu trả lời" aria-label="Hiện / Ẩn câu trả lời" aria-expanded="true">▲</button>
								<button type="button" class="speak-btn" title="Đọc câu hỏi" aria-label="Đọc câu hỏi" data-speak="${englishQuestion.replace(/"/g, '&quot;')}">🔊</button>
							</div>
						</div>
						<ul class="answer-list" style="display:block;">
							${item.answers.join('')}
						</ul>
					</div>
				`);
			});
			html.push('</div></section>');

			content.innerHTML = html.join('');
			content.querySelectorAll('.toggle-btn').forEach((button) => {
				button.addEventListener('click', () => {
					const item = button.closest('.assignment-item');
					if (!item) return;
					const isOpen = item.classList.toggle('open');
					button.textContent = isOpen ? '▲' : '▼';
					button.setAttribute('aria-expanded', String(isOpen));
					const answers = item.querySelector('.answer-list');
					if (answers) answers.style.display = isOpen ? 'block' : 'none';
				});
			});
			content.querySelectorAll('.speak-btn').forEach((button) => {
				button.addEventListener('click', () => speakText(button.dataset.speak || ''));
			});
		}

		function renderAssignment(n){
			if (String(n) === '1') {
				renderAssignment1();
				return;
			}
			if (String(n) === '2') {
				renderAssignment2();
				return;
			}
			if (String(n) === '3') {
				renderAssignment3();
				return;
			}
			content.innerHTML = `<h2>Assignment ${n}</h2><p>Không có nội dung cho Assignment ${n}.</p>`;
		}

		selector.addEventListener('change', () => renderAssignment(selector.value));
		if ('speechSynthesis' in window) {
			refreshVoices();
			window.speechSynthesis.addEventListener('voiceschanged', refreshVoices);
		}

		// initial
		renderAssignment(selector.value);
	</script>
</body>
</html>
