<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Viết Tiếng Anh Đa Chế Độ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 5px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
            color: #34495e;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            background-color: #fff;
            outline: none;
        }
        select:focus {
            border-color: #3498db;
        }
        /* Style riêng cho cụm chọn chế độ hiển thị */
        .mode-container {
            display: flex;
            gap: 20px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            border: 1px dashed #3498db;
        }
        .mode-option {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
        }
        .mode-option input {
            margin-right: 8px;
            cursor: pointer;
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 4px;
            resize: vertical;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea:focus {
            border-color: #3498db;
            outline: none;
        }
        #resultSection {
            margin-top: 25px;
        }
        .score-box {
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-bottom: 20px;
            background-color: #e2e8f0;
            color: #4a5568;
            transition: all 0.3s ease;
        }
        .review-panel {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            padding: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            font-size: 16px;
            line-height: 2;
            min-height: 50px;
        }
        .correct-word {
            color: #27ae60;
            font-weight: 500;
        }
        .wrong-word {
            color: #c0392b;
            background-color: #fce4d6;
            text-decoration: line-through red;
            font-weight: bold;
            padding: 0 2px;
            border-radius: 2px;
        }
        .missing-word {
            color: #7f8c8d;
            font-style: italic;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Ứng Dụng Chấm Bài Thông Minh</h1>
    <p style="text-align: center; color: #7f8c8d; margin-top: 0; margin-bottom: 25px;">Hệ thống chấm điểm tự động theo thời gian thực và hỗ trợ chuyển đổi chế độ hiển thị lỗi.</p>
    
    <!-- 1. Chọn bài viết -->
    <div class="form-group">
        <label for="topicSelect">1. Chọn bài viết muốn luyện tập:</label>
        <select id="topicSelect" onchange="resetForm()">
            <option value="film">Film night</option>
            <option value="holiday">My holiday</option>
            <option value="studying">Studying together</option>
            <option value="restaurant">The Restaurant</option>
        </select>
    </div>

    <!-- 2. Chọn chế độ hiển thị (Yêu cầu mới) -->
    <div class="form-group">
        <label>2. Chọn chế độ hiển thị lỗi sai:</label>
        <div class="mode-container">
            <label class="mode-option">
                <input type="radio" name="displayMode" value="1" checked onchange="checkTextDetailed()">
                Chế độ 1: Chỉ hiện chữ đỏ sai (Ẩn từ đúng)
            </label>
            <label class="mode-option">
                <input type="radio" name="displayMode" value="2" onchange="checkTextDetailed()">
                Chế độ 2: Vừa hiện chữ đỏ sai + Vừa hiện kết quả đúng
            </label>
        </div>
    </div>

    <!-- 3. Ô nhập liệu -->
    <div class="form-group">
        <label for="userInput">3. Nhập bài làm của bạn tại đây:</label>
        <textarea id="userInput" oninput="checkTextDetailed()" placeholder="Bắt đầu gõ bài viết tiếng Anh tại đây..."></textarea>
    </div>

    <!-- Kết quả tự động -->
    <div id="resultSection">
        <div id="scoreBox" class="score-box">Độ chính xác: 0% (0/0 từ)</div>
        <h3>Chi tiết bài làm (Cập nhật trực tiếp):</h3>
        <div id="reviewPanel" class="review-panel">Chưa có dữ liệu. Hãy gõ gì đó vào ô nhập liệu...</div>
    </div>
</div>

<script>
    const essayDatabase = {
        film: `Dear Lisa,
Thanks for your email, it's great to hear from you!
First, my studies are going great at the moment, thank you! Regarding your question about the movie, you can decide what we watch because you have good taste. About the snacks, I think I will bring some popcorn and fruit juice. Finally, 6.00 is a perfect time for me, so it is not too early at all.
Write back soon! Best, Quan.`,

        holiday: `Dear Martin,
Thanks for your email, it's great to hear from you!
First, yes, it was wonderful talking to you on the phone last week. Regarding your question about the weather, it is quite cold in November, so you should bring warm clothes. About our meeting, I think we can meet up on Saturday afternoon at a nice café. Finally, yes, please bring me some chocolate from England!
Write back soon! Best, Quan.`,

        studying: `Dear Kelly,
Thanks for your email, it's great to hear from you!
First, yes, I am so pleased that we are studying together next week. Regarding your question about food, I think we should get a takeaway to save time. About the computer, personally, I prefer to bring my own laptop because all my notes are in it. Finally, I can come to your house on Wednesday afternoon.
Write back soon! Best, Quan`,

        restaurant: `Dear Maura,
Thanks for your email, it's great to hear from you!
First, great! I am so happy that you have finally finished your exams. Regarding your question about the restaurant, it is a beautiful place with delicious food. About your young nephew and niece, I think the main meals are OK for them and they also have a special kids' menu. Finally, yes, the restaurant is very busy, so I recommend reserving a table.
Write back soon! Best, Quan`
    };

    function splitIntoWords(text) {
        if (!text) return [];
        return text.trim().split(/\s+/);
    }

    function cleanWordForCompare(word) {
        if (!word) return "";
        return word.toLowerCase().replace(/^[.,\/#!$%\^&\*;:{}=\-_`~()\[\]'"]+|[.,\/#!$%\^&\*;:{}=\-_`~()\[\]'"]+$/g, "");
    }

    function resetForm() {
        document.getElementById('userInput').value = "";
        const scoreBox = document.getElementById('scoreBox');
        scoreBox.innerText = "Độ chính xác: 0% (0/0 từ)";
        scoreBox.style.backgroundColor = "#e2e8f0";
        scoreBox.style.color = "#4a5568";
        document.getElementById('reviewPanel').innerHTML = "Chưa có dữ liệu. Hãy gõ gì đó vào ô nhập liệu...";
    }

    function checkTextDetailed() {
        const selectedTopic = document.getElementById('topicSelect').value;
        const userInput = document.getElementById('userInput').value;
        const scoreBox = document.getElementById('scoreBox');
        const reviewPanel = document.getElementById('reviewPanel');

        // Lấy chế độ hiển thị đang được chọn (1 hoặc 2)
        const currentMode = document.querySelector('input[name="displayMode"]:checked').value;

        const originalText = essayDatabase[selectedTopic];
        const originalWords = splitIntoWords(originalText);
        const userWords = splitIntoWords(userInput);

        if (userInput.trim() === "") {
            scoreBox.innerText = "Độ chính xác: 0% (0/0 từ)";
            scoreBox.style.backgroundColor = "#e2e8f0";
            scoreBox.style.color = "#4a5568";
            reviewPanel.innerHTML = "Chưa có dữ liệu. Hãy gõ gì đó vào ô nhập liệu...";
            return;
        }

        let correctCount = 0;
        let htmlOutput = "";

        userWords.forEach((uWord, index) => {
            const oWord = originalWords[index];

            if (oWord && cleanWordForCompare(uWord) === cleanWordForCompare(oWord)) {
                correctCount++;
                htmlOutput += `<span class="correct-word">${uWord}</span> `;
            } else {
                if (currentMode === "2") {
                    // Chế độ 2: Hiện cả từ sai kèm theo từ gốc để so sánh
                    let gợiÝ = oWord ? ` (Gốc: "${oWord}")` : " (Từ thừa)";
                    htmlOutput += `<span class="wrong-word">${uWord}</span><span class="missing-word">${gợiÝ}</span> `;
                } else {
                    // Chế độ 1: Chỉ hiện từ sai có gạch nền đỏ, giấu từ đúng đi
                    htmlOutput += `<span class="wrong-word">${uWord}</span> `;
                }
            }
        });

        if (userWords.length < originalWords.length) {
            htmlOutput += `<br><span class="missing-word">... Đang gõ (Còn thiếu ${originalWords.length - userWords.length} từ).</span>`;
        }

        const accuracyPercentage = Math.round((correctCount / originalWords.length) * 100);

        scoreBox.innerText = `Độ chính xác hiện tại: ${accuracyPercentage}% (${correctCount}/${originalWords.length} từ)`;
        
        if (accuracyPercentage === 100) {
            scoreBox.style.backgroundColor = "#d4edda";
            scoreBox.style.color = "#155724";
        } else if (accuracyPercentage >= 70) {
            scoreBox.style.backgroundColor = "#fff3cd";
            scoreBox.style.color = "#856404";
        } else {
            scoreBox.style.backgroundColor = "#f8d7da";
            scoreBox.style.color = "#721c24";
        }

        reviewPanel.innerHTML = htmlOutput;
    }
</script>

</body>
</html>
